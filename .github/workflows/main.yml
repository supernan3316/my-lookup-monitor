name: Hourly LookUp Monitor

on:
  schedule:
    # 這裡設置的是 UTC 時間
    # 上午 11:00 (北京/台北時間) = UTC 03:00
    # 下午 09:00 (北京/台北時間) = UTC 13:00
    - cron: '0 3,13 * * *'
  workflow_dispatch: # 保留這個，方便你隨時點按鈕手動測試

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run logic
        env:
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
        run: python monitor.py
      - name: Auto save history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.txt || true
          git commit -m "Update history" || true
          git push || true
